[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avelo-ui2-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "groq>=0.37,<1", "pydantic>=2.8,<3", "httpx>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["avelo_backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: explicit opt-in, synthetic Groq inference only"]
